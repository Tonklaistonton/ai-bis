name: Deploy to Render

on:
  workflow_run:
    workflows: [AIZEN CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      # Configure the Render service to use main and disable its automatic deploys.
      # The hook requests the exact commit that passed CI, not the latest branch tip.
      - name: Request deployment of tested commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$RENDER_DEPLOY_HOOK_URL" =~ ^https://api\.render\.com/deploy/srv-[A-Za-z0-9]+\?key=[A-Za-z0-9_-]+$ ]]; then
            printf '%s\n' 'Set production secret RENDER_DEPLOY_HOOK_URL to the deploy hook from Render.' >&2
            exit 1
          fi
          curl --silent --fail --output /dev/null \
            --connect-timeout 15 --max-time 60 \
            --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}"
          printf 'Deployment requested for %s. Check Render for build and health status.\n' "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
